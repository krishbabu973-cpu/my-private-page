<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Protected Page 💗</title>
<style>
body {
  background:#ffd6e8;
  text-align:center;
  font-family:Poppins, sans-serif;
  padding-top:80px;
}
input{
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ff5fa2;
  margin-right:10px;
}
button{
  padding:12px 25px;
  font-size:16px;
  border:none;
  border-radius:25px;
  background:#ff5fa2;
  color:white;
  cursor:pointer;
}
</style>
</head>
<body>

<h2>Enter the secret password 💖</h2>
<input type="password" id="pwd" placeholder="Password here">
<button onclick="checkPassword()">Submit</button>

<script>
function checkPassword(){
    var input = document.getElementById('pwd').value;
    var password = "meri panda";
    if(input === password){
        window.location.href = "her.html";
    } else {
        alert("Wrong password! 😢");
    }
}
</script>

</body>
</html>
